<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="neonGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Outer Framing / Aperture Frame -->
  <g filter="url(#neonGlow)" stroke="url(#neonGrad1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Corner Frame -->
    <path d="M 28 42 L 28 28 L 42 28" />
    <!-- Top-Right Corner Frame -->
    <path d="M 92 42 L 92 28 L 78 28" />
    <!-- Bottom-Left Corner Frame -->
    <path d="M 28 78 L 28 92 L 42 92" />
    <!-- Bottom-Right Corner Frame -->
    <path d="M 92 78 L 92 92 L 78 92" />

    <!-- 4 Diagonal Resizing Outward Arrows -->
    <path d="M 45 45 L 22 22 M 22 30 L 22 22 L 30 22" />
    <path d="M 75 45 L 98 22 M 90 22 L 98 22 L 98 30" />
    <path d="M 45 75 L 22 98 M 30 98 L 22 98 L 22 90" />
    <path d="M 75 75 L 98 98 M 98 90 L 98 98 L 90 98" />

    <!-- Cardinal Arrows (Up, Down, Left, Right) -->
    <path d="M 60 40 L 60 18 M 55 24 L 60 18 L 65 24" />
    <path d="M 60 80 L 60 102 M 55 96 L 60 102 L 65 96" />
    <path d="M 40 60 L 18 60 M 24 55 L 18 60 L 24 65" />
    <path d="M 80 60 L 102 60 M 96 55 L 102 60 L 96 65" />
  </g>

  <!-- Central Camera Lens / Aperture Iris -->
  <circle cx="60" cy="60" r="18" fill="#0b0f19" stroke="url(#neonGrad2)" stroke-width="2.5" filter="url(#neonGlow)"/>
  
  <!-- Aperture Blades -->
  <g stroke="url(#neonGrad1)" stroke-width="1.8" fill="none" opacity="0.95" stroke-linecap="round">
    <line x1="48" y1="52" x2="68" y2="48" />
    <line x1="68" y1="48" x2="73" y2="67" />
    <line x1="73" y1="67" x2="57" y2="73" />
    <line x1="57" y1="73" x2="48" y2="58" />
    <line x1="48" y1="58" x2="63" y2="52" />
  </g>

  <!-- Center Core Lens Glint -->
  <circle cx="60" cy="60" r="5" fill="#38bdf8" opacity="0.9" filter="url(#neonGlow)"/>
</svg>
